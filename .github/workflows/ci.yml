name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.6.3"
          terraform_wrapper: false

      - name: terraform fmt -check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: terraform init & validate
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate

      - name: ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -e SC1091 \
            scripts/bootstrap.sh \
            scripts/join.sh \
            scripts/lib/common.sh \
            scripts/lib/workspace.sh \
            docker/entrypoint.sh

      # No floating @v3 tag — pin a real release (latest: v3.4.0).
      - uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

  image:
    name: Docker build & smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Plain docker build (no buildx) — reliable smoke on the runner.
      # Base stupean/yandex-terraform must be public (or add pull login).
      - name: Build & smoke
        run: |
          docker build -t terraform-yc-bootstrap:ci .
          docker run --rm terraform-yc-bootstrap:ci help

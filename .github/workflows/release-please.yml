name: Release Please

# Publish runs in this workflow (not on tag push): tags created with GITHUB_TOKEN
# do not trigger other workflows. See CONTRIBUTING.md.
on:
  push:
    branches: [main]

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    name: Open / update Release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Build and push to Docker Hub
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require release outputs
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${VERSION}" || -z "${TAG}" || -z "${SHA}" ]]; then
            echo "release-please outputs incomplete: version='${VERSION}' tag='${TAG}' sha='${SHA}'" >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Publish image
        uses: ./.github/actions/publish-image
        with:
          version: ${{ needs.release-please.outputs.version }}
          release-tag: ${{ needs.release-please.outputs.tag_name }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          github-token: ${{ github.token }}
